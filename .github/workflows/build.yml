name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Documentation-only changes do not need a new image.
    paths-ignore:
      - "**.md"
  schedule:
    # Rebuild every day so that the image always tracks the newest
    # nixpkgs-unstable and the newest Determinate Nix.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: detnix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  IMAGE_VERSION: "0.1.0"

jobs:
  build:
    name: build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v9
        # The cache service is occasionally unavailable. That only costs us
        # build time, it must not fail the build.
        continue-on-error: true

      - name: Refresh inputs (newest nixpkgs-unstable + newest Determinate Nix)
        run: |
          nix flake update
          nix flake metadata --json | jq -r '.locks.nodes | to_entries[] | "\(.key): \(.value.locked.rev // .value.locked.lastModified)"'

      - name: Build images
        run: nix build .#image .#imageRoot --print-build-logs

      - name: Load images into Docker
        run: |
          set -euxo pipefail
          # `result` is a symlink; resolve it, otherwise the decompressors
          # refuse to read it (zstd skips symlinks silently).
          for link in result result-1; do
            archive="$(readlink -f "$link")"
            case "$archive" in
              *.zst) zstd -dc "$archive" | docker load ;;
              *.gz)  gzip -dc "$archive" | docker load ;;
              *)     docker load -i "$archive" ;;
            esac
          done
          docker image ls

      - name: Smoke test (unprivileged)
        run: |
          set -euxo pipefail
          # The image runs as the unprivileged user "detnix" (uid 1000) by
          # default: Nix works without root and without a Nix daemon.
          docker run --rm "detnix:$IMAGE_VERSION" /bin/sh -c '
            id
            echo "HOME=$HOME"
            mkdir -p "$HOME/.config/nix"
            nix --version
            nix eval --raw nixpkgs#hello.name
            nix build --no-link nixpkgs#hello
          '

      - name: Smoke test (root flavour)
        run: |
          set -euxo pipefail
          # The root flavour of the same image: CI jobs that append to
          # /etc/hosts need it, because container runtimes mount the host's
          # /etc/hosts over the one in the image.
          docker run --rm "detnix:$IMAGE_VERSION-root" /bin/sh -c '
            id
            nix --version
            nix eval --raw nixpkgs#hello.name
          '

      - name: Smoke test (systemd)
        run: |
          set -euxo pipefail
          docker run -d --name detnix-smoke \
            --user root --privileged --cgroupns=host \
            --tmpfs /run --tmpfs /run/lock --tmpfs /tmp \
            "detnix:$IMAGE_VERSION"
          for i in $(seq 1 30); do
            state=$(docker exec detnix-smoke systemctl is-system-running || true)
            case "$state" in
              running|degraded) break ;;
            esac
            sleep 2
          done
          docker exec detnix-smoke systemctl is-system-running || true
          docker exec detnix-smoke systemctl list-units --failed --no-pager || true
          docker exec detnix-smoke nix --version
          docker exec detnix-smoke nix eval --raw nixpkgs#hello.name
          docker exec detnix-smoke nix-build '<nixpkgs>' -A hello --no-out-link
          docker stop detnix-smoke

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          set -euxo pipefail
          # The unprivileged flavour.
          docker tag "detnix:$IMAGE_VERSION" "$IMAGE_NAME:latest-${{ matrix.arch }}"
          docker tag "detnix:$IMAGE_VERSION" "$IMAGE_NAME:$IMAGE_VERSION-${{ matrix.arch }}"
          docker push "$IMAGE_NAME:latest-${{ matrix.arch }}"
          docker push "$IMAGE_NAME:$IMAGE_VERSION-${{ matrix.arch }}"
          # The root flavour.
          docker tag "detnix:$IMAGE_VERSION-root" "$IMAGE_NAME:latest-root-${{ matrix.arch }}"
          docker tag "detnix:$IMAGE_VERSION-root" "$IMAGE_NAME:$IMAGE_VERSION-root-${{ matrix.arch }}"
          docker push "$IMAGE_NAME:latest-root-${{ matrix.arch }}"
          docker push "$IMAGE_NAME:$IMAGE_VERSION-root-${{ matrix.arch }}"

  manifest:
    name: publish manifest list
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        uses: docker/setup-buildx-action@v3

      - name: Create and push manifest list
        run: |
          set -euxo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:latest" \
            "$IMAGE_NAME:latest-amd64" \
            "$IMAGE_NAME:latest-arm64"
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$IMAGE_VERSION" \
            "$IMAGE_NAME:$IMAGE_VERSION-amd64" \
            "$IMAGE_NAME:$IMAGE_VERSION-arm64"
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:latest-root" \
            "$IMAGE_NAME:latest-root-amd64" \
            "$IMAGE_NAME:latest-root-arm64"
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$IMAGE_VERSION-root" \
            "$IMAGE_NAME:$IMAGE_VERSION-root-amd64" \
            "$IMAGE_NAME:$IMAGE_VERSION-root-arm64"
          docker buildx imagetools inspect "$IMAGE_NAME:latest"
